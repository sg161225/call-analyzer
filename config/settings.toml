# Call Analyzer settings. Edit freely; the app reloads them on every run.
# API keys do NOT go here: put them in the .env file (see .env.example).

[company]
# Tells the AI what your business and product are, so it can judge the pitch.
name = "BUSY"
product = "BUSY accounting & billing software (desktop + mobile app)"
context = """
Our executives call existing and dropped customers to retain them, renew licences,
upsell the mobile app and resolve complaints. A good call: probes the business first,
builds a need, pitches relevant features with a concrete offer, answers every query,
handles objections with empathy, and ends with a dated next step.
"""

[transcription]
# Engine used to turn audio into text (internal only; transcripts are not stored).
# One of: "groq" (free tier), "local" (free, slow), "sarvam" (paid), "openai" (paid)
engine = "groq"
# Groq: "translate" turns Hindi/Hinglish speech straight into English (clearer, uses fewer
# free-tier tokens); "transcribe" keeps the original language.
groq_task = "translate"
groq_model = "whisper-large-v3"
# Sarvam: model + mode. "codemix" keeps English words (voucher, GST, laptop) in English.
sarvam_model = "saaras:v3"
sarvam_mode = "codemix"
sarvam_language = "unknown"     # or "hi-IN", "en-IN", ...
# OpenAI: "gpt-4o-transcribe" or "whisper-1"
openai_model = "gpt-4o-transcribe"
# Local faster-whisper: model name ("large-v3", "medium", "small") or a folder path
local_model = "large-v3"
# Product / domain words to help recognition (Sarvam saaras:v4 and OpenAI prompt)
keyterms = ["BUSY", "voucher", "GST", "invoice", "e-way bill", "renewal", "mobile app"]

[analysis]
# Who writes the call reviews: "groq" (free tier) or "anthropic" (paid, best quality)
provider = "groq"
# Groq model. Alternatives: "llama-3.3-70b-versatile", "openai/gpt-oss-20b" (higher free limits)
groq_model = "openai/gpt-oss-120b"
# Anthropic model (used only when provider = "anthropic")
model = "claude-opus-5-5"
# low | medium | high: higher = more thorough, slower (and costlier on paid providers)
effort = "medium"

[storage]
# Keep each call's recording (compressed MP3, ~1 MB per 4 minutes) and its timed transcript, so they can be
# played and read on the call page. Set to false to keep only the AI review (recording and transcript are
# deleted right after processing).
keep_recordings = true
